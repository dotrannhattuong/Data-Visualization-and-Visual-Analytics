<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Coordinate Plots Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            text-align: center; 
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            margin: 0;
            padding: 20px 0;
            transition: background-color 0.5s ease;
        }
        h1 {
            font-size: 2em;
            color: #444;
            margin-bottom: 20px;
        }
        #dataviz {
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 960px;
            height: 450px;
            background-color: #fff;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        p {
            color: #666;
            font-size: 1em;
        }
        p:hover {
            color: #000;
            transition: color 0.3s ease;
        }
    </style>
</head>
<body>
    <h1>Parallel Coordinate Plots</h1>
    <div id="dataviz"></div>
    <p>Drag the axis labels to rearrange the dimensions.</p>
    
    <!-- Load D3.js library -->
    <script src="https://d3js.org/d3.v4.js"></script>
    <script src="312540013.js"></script> <!-- Your script file -->
</body>
</html>
