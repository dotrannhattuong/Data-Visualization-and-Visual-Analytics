<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Chart Visualization</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f0f8ff;
            color: #333;
            font-family: 'Arial', sans-serif;
        }
        h1, h2 {
            color: #2c3e50;
        }
        h1 {
            margin-top: 30px;
            font-size: 3em;
            font-weight: bold;
        }
        #horizon-chart {
            margin-top: 30px;
        }
        hr {
            border-top: 2px solid #2c3e50;
        }
    </style>
</head>

<body class="text-center">
    <!-- Page Title -->
    <h1 class="myweb">Horizon Chart Visualization</h1>
    <!-- Dataset Source Link -->
    <h2 class="myweb">
        <a href="https://www.kaggle.com/datasets/bappekim/air-pollution-in-seoul" target="_blank">
            Air Pollution in Seoul Dataset
        </a>
    </h2>
    
    <div class="myweb">
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio1" value="SO2" checked>
            <label class="form-check-label" for="radioSO2">SO2</label>

        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio2" value="NO2">
            <label class="form-check-label" for="radioNO2">NO2</label>

        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio3" value="O3">
            <label class="form-check-label" for="radioO3">O3</label>

        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio4" value="CO">
            <label class="form-check-label" for="radioO3">O3</label>

        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio5" value="PM10">
            <label class="form-check-label" for="radioPM10">PM10</label>

        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="type" id="inlineRadio6" value="PM2.5">
            <label class="form-check-label" for="radioPM25">PM2.5</label>
        </div>
    </div>

    <!-- Container for the horizon chart -->
    <div id="horizon-chart"></div>
    <hr class="myweb">
    
    <!-- Include D3.js and Horizon Timeseries Chart libraries -->
    <script src="https://d3js.org/d3.v6.js"></script>
    <script src="//unpkg.com/horizon-timeseries-chart"></script>
    <!-- Include custom JavaScript for chart rendering -->
    <script src="312540013.js"></script>
</body>
</html>
